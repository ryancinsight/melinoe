[package]
name = "melinoe"
version = "0.9.0"
edition = "2021"
rust-version = "1.65"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Zero-sized, branded, multi-token phantom capabilities for compile-time data-access and thread-synchronization proofs (a generalized evolution of GhostCell) for the Mnemosyne memory ecosystem."
documentation = "https://docs.rs/melinoe"
repository = "https://github.com/ryancinsight/melinoe"
license = "MIT OR Apache-2.0"
keywords = ["ghostcell", "phantom", "capability", "no_std", "concurrency"]
categories = ["no-std", "concurrency", "rust-patterns", "memory-management"]
readme = "README.md"

[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

[features]
default = ["std"]
# `alloc` pulls in the `alloc` crate so branded cells over heap-owning payloads
# (`Box`, `Vec`, ...) can be exercised in examples/tests without `std`.
alloc = []
# `std` is a superset of `alloc`; it additionally enables the `std`-gated
# cross-thread handoff demonstrations that rely on `std::thread::scope`.
std = ["alloc"]
# `nightly` enables `doc_cfg` for precise feature-gated documentation (requires
# a nightly toolchain) and reserves the surface for future
# `generic_const_exprs`-based capability sets.
nightly = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

# The codegen probe exercises the alloc-gated `CellCowExt::borrow_cow` boundary,
# so it only compiles with `alloc`. Gating it keeps `--no-default-features`
# (which excludes `alloc`) building cleanly across all targets.
[[example]]
name = "codegen"
required-features = ["alloc"]

[[bench]]
name = "access"
harness = false
required-features = ["std"]

[[bench]]
name = "mnemosyne"
harness = false
required-features = ["std"]

[[bench]]
name = "concurrent_reads"
harness = false
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

# Stack lint floor. New and touched code meets it in full; the `allow` entries
# are a curated, non-increasing baseline for classes that fire broadly across
# the existing tree, each recorded with its measured hit count at the revision
# the floor was established. Removing an entry (or shrinking its count) is
# burn-down work. Anything not listed is a hard error.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Melinoe is a soundness crate: an input-dependent `unwrap` panics inside every
# consumer's process. Zero production sites; test and bench targets carry a
# scoped file-level allow, since a panic there is the assertion.
unwrap_used = "deny"

# --- Curated baseline (hit counts measured 2026-08-14, --all-targets) ---
# `'brand` is this crate's central concept — the invariant lifetime that carries
# the capability proof. Eliding it to `'_` in impl headers would erase the one
# name a reader most needs, so the explicit binding is deliberate throughout.
elidable_lifetime_names = "allow"     # 50
# examples/codegen.rs is a codegen probe: `#[no_mangle]` exists precisely to pin
# symbols so the emitted assembly can be inspected for zero-cost claims.
no_mangle_with_rust_abi = "allow"     # 12  (examples/codegen.rs)
# Test and bench scaffolding: index/size arithmetic over fixture-sized data.
cast_possible_truncation = "allow"    # 13  (tests, benches)
cast_possible_wrap = "allow"          # 5   (tests, benches)
items_after_statements = "allow"      # 14  (tests/partition.rs)
explicit_iter_loop = "allow"          # 6   (tests, benches)
from_iter_instead_of_collect = "allow" # 5  (tests, benches)
manual_assert = "allow"               # 2   (tests/partition.rs)
manual_let_else = "allow"             # 2   (tests)
too_many_lines = "allow"              # 1   (benches/concurrent_reads.rs)
borrow_as_ptr = "allow"               # 3   (tests)

[[bench]]
name = "false_sharing"
harness = false
required-features = ["std"]

[[bench]]
name = "conditional_atomics"
harness = false
required-features = ["std"]

[[bench]]
name = "branded_vec"
harness = false
required-features = ["alloc"]

[[test]]
name = "branded_vec"
required-features = ["alloc"]

[[test]]
name = "branded_deque"
required-features = ["alloc"]

[[bench]]
name = "branded_deque"
harness = false
required-features = ["alloc"]
