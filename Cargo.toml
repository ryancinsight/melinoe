[package]
name = "melinoe"
version = "0.9.0"
edition = "2021"
rust-version = "1.81"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Zero-sized, branded, multi-token phantom capabilities for compile-time data-access and thread-synchronization proofs (a generalized evolution of GhostCell) for the Mnemosyne memory ecosystem."
documentation = "https://docs.rs/melinoe"
repository = "https://github.com/ryancinsight/melinoe"
license = "MIT OR Apache-2.0"
keywords = ["ghostcell", "phantom", "capability", "no_std", "concurrency"]
categories = ["no-std", "concurrency", "rust-patterns", "memory-management"]
readme = "README.md"

[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

[features]
default = ["std"]
# `alloc` pulls in the `alloc` crate so branded cells over heap-owning payloads
# (`Box`, `Vec`, ...) can be exercised in examples/tests without `std`.
alloc = []
# `std` is a superset of `alloc`; it additionally enables the `std`-gated
# cross-thread handoff demonstrations that rely on `std::thread::scope`.
std = ["alloc"]
# `nightly` enables `doc_cfg` for precise feature-gated documentation (requires
# a nightly toolchain) and reserves the surface for future
# `generic_const_exprs`-based capability sets.
nightly = []

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

# The codegen probe exercises the alloc-gated `CellCowExt::borrow_cow` boundary,
# so it only compiles with `alloc`. Gating it keeps `--no-default-features`
# (which excludes `alloc`) building cleanly across all targets.
[[example]]
name = "codegen"
required-features = ["alloc"]

[[bench]]
name = "access"
harness = false
required-features = ["std"]

[[bench]]
name = "mnemosyne"
harness = false
required-features = ["std"]

[[bench]]
name = "concurrent_reads"
harness = false
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

# Pedantic floor ratchet: every class listed below already fires in this
# workspace and is allowed at its measured baseline; every class NOT listed
# is a hard error. Counts are `cargo clippy --all-targets` hits at the time
# the floor was established (total / production, production excluding
# `#[cfg(test)]` modules and test, bench and example targets). Burn a class
# down to zero, then delete its line -- the floor tightens, never loosens.
#
# Classes with few enough sites to fix outright were fixed, not listed:
# manual_assert, manual_let_else, borrow_as_ptr, from_iter_instead_of_collect
# and explicit_iter_loop are all denied with zero remaining sites.

# --- Lifetime naming (50 sites, 50 in production) ---
# `'brand` is this crate's central concept -- the invariant lifetime carrying
# the capability proof. Eliding it to `'_` in impl headers would erase the one
# name a reader most needs, so the explicit binding is deliberate throughout.
elidable_lifetime_names = "allow" # 50 (50 prod)

# --- Codegen probe (12 sites, 0 in production) ---
# examples/codegen.rs pins symbols with `#[no_mangle]` precisely so the emitted
# assembly can be inspected for the zero-cost claims.
no_mangle_with_rust_abi = "allow" # 12 (0 prod)

# --- Test/bench scaffolding debt (32 sites, 0 in production) ---
items_after_statements = "allow" # 14 (0 prod)
cast_possible_truncation = "allow" # 13 (0 prod)
cast_possible_wrap = "allow" # 5 (0 prod)
too_many_lines = "allow" # 1 (0 prod)

# --- Restriction floor ---
# Melinoe is a soundness crate: an input-dependent `unwrap` panics inside every
# consumer's process. Denied outright with no ratchet -- zero production sites.
unwrap_used = "deny"
# A library never writes to the process's stdio; output belongs to the caller.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

[[bench]]
name = "false_sharing"
harness = false
required-features = ["std"]

[[bench]]
name = "conditional_atomics"
harness = false
required-features = ["std"]

[[bench]]
name = "branded_vec"
harness = false
required-features = ["alloc"]

[[test]]
name = "branded_vec"
required-features = ["alloc"]

[[test]]
name = "branded_deque"
required-features = ["alloc"]

[[bench]]
name = "branded_deque"
harness = false
required-features = ["alloc"]
