[package]
name = "halo"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"
authors = ["Ryan Clanton <ryanclanton@outlook.com>"]
description = "Melinoe-backed branded collection adapters."
documentation = "https://docs.rs/halo"
repository = "https://github.com/ryancinsight/melinoe"
license = "MIT OR Apache-2.0"
keywords = ["ghostcell", "phantom", "capability", "collections"]
categories = ["no-std", "concurrency", "rust-patterns"]
readme = "README.md"

[dependencies]
melinoe = { path = "../..", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "branded_vec"
harness = false

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
