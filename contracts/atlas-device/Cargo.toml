[workspace]

[package]
name = "melinoe-atlas-device-contract"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
melinoe = { path = "../.." }
hephaestus-core = { path = "../../../hephaestus/crates/hephaestus-core" }
hephaestus-wgpu = { path = "../../../hephaestus/crates/hephaestus-wgpu" }

# This standalone cross-repository contract must resolve every first-party
# source to the same immutable path set. These source/package mappings are the
# closure emitted by scripts/atlas-stack-overlay.py for the selected stack.
