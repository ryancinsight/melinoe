name: CI

# This repository had no test workflow. `book-pages.yml`, `msrv.yml` and
# `rust-release.yml` were the whole of its CI, so 127 native tests and 31
# doctests were committed, maintained, and never run by anything but a person
# choosing to run them. All of them pass; nothing was watching.
#
# `msrv.yml` already builds at the 1.81 floor, so that is not repeated here.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: melinoe-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e # nextest
        with:
          tool: nextest

      # Cheapest first, so a formatting slip costs seconds rather than a build.
      - name: Format
        run: cargo fmt --all -- --check

      # `std` is a superset of `alloc`, and the crate's whole point is that the
      # branded types work without either. A default-features build would never
      # exercise that, so the no-default-features check is not optional here.
      - name: Build without default features
        run: cargo check --locked --no-default-features

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Native tests
        run: cargo nextest run --locked --all-features

      - name: Documentation tests
        run: cargo test --locked --doc --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
