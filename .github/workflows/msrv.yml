name: Minimum Supported Rust Version

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/msrv.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "build.rs"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - ".github/workflows/msrv.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "benches/**"
      - "build.rs"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: msrv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust 1.81.0 check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared MSRV
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.81.0

      # The consumer-facing surface only. `--all-targets` cannot run at the
      # declared floor: the locked dev-dependency closure (clap_builder, via
      # criterion) is edition 2024 and needs Cargo 1.85, so an all-target run
      # at 1.81 fails in manifest parsing before it reaches this crate's code.
      # Dev-dependencies are not part of the contract a consumer compiles
      # against, so they do not set this crate's `rust-version`. The floor
      # itself is `#[expect(..., reason = ...)]` (`lint_reasons`, stabilized
      # 1.81) across `src/`; 1.80 fails it with 14 x E0658.
      - name: Check the library at the MSRV
        run: cargo check --locked --all-features
